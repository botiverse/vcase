org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
kotlin.code.style=official
# Small machines / CI: compile Kotlin inside the Gradle JVM instead of a second daemon.
kotlin.compiler.execution.strategy=in-process
# iOS klibs are compiled on Linux/Windows too (cross-compilation); linking needs macOS.
kotlin.native.ignoreDisabledTargets=true
