name: Publish npm package

# Publishes packages/react (@vcase/react) to npm through trusted publishing (OIDC): no npm
# token is stored. The trusted publisher on npmjs.com names this repository, this file
# (npm-publish.yml) and the environment `npm`, which only v* tags may deploy to, so no other
# workflow or branch can publish. Runs on the same v* tags as the Maven release; the tag must
# match packages/react/package.json's version.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: npm
    defaults:
      run:
        working-directory: packages/react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: npm with trusted publishing
        run: npm install -g npm@^11.15.0
      - name: Tag matches package version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match packages/react version $version"
            exit 1
          fi
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Skip if this version is already on npm
        id: exists
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "$name@$version is already published"
          fi
      - if: steps.exists.outputs.already != 'true'
        run: npm publish
