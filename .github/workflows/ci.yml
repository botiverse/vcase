name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Run on a branch without opening a pull request.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # Unit tests of every module, the desktop adapter tests, and the sample's goldens
      # (zero tolerance, renderer desktop-skiko) plus its manifest-matches-scan check.
      - run: ./gradlew check --no-daemon
      - name: Upload vcase report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vcase-report
          path: |
            samples/compose-desktop/build/vcase/
            */build/reports/tests/
